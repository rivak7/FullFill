[project]
name = "fullfill-capture"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fullfill-contracts", "numpy>=2,<3"]

[project.optional-dependencies]
camera = ["opencv-python>=4.11,<5"]

[tool.uv.sources]
fullfill-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fullfill_capture"]
