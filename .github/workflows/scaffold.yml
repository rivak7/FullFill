name: Checks and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv python install 3.13
      - run: make setup
      - run: make check

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fullfill-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_WhFivTmKGIsgmTagqxCvoZoK
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Skip superseded commits
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_main" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit is on main; its run will deploy instead." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check deployment credentials
        if: steps.target.outputs.current == 'true'
        env:
          API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          ORDER_TOKEN: ${{ secrets.VERCEL_ORDER_TOKEN }}
          KITCHEN_TOKEN: ${{ secrets.VERCEL_KITCHEN_TOKEN }}
        run: |
          for name in API_TOKEN ORDER_TOKEN KITCHEN_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing VERCEL_$name repository secret. See docs/vercel.md."
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        if: steps.target.outputs.current == 'true'
        with:
          node-version: "22"
      - name: Install Vercel CLI
        if: steps.target.outputs.current == 'true'
        run: npm install --global vercel@64.5.0
      - name: Deploy API
        if: steps.target.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: prj_psFAtet3Akkbr5c6I4BRfQumva2l
        run: >-
          vercel deploy --prod --yes --no-color
          --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"
          --meta fullfillCommitSha="$GITHUB_SHA" --meta fullfillWorkflowRun="$GITHUB_RUN_ID"
      - name: Deploy ordering site
        if: steps.target.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ORDER_TOKEN }}
          VERCEL_PROJECT_ID: prj_mpw9VYBtvcGYbLlcdqGQgApXwW31
        run: >-
          vercel deploy --prod --yes --no-color
          --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"
          --meta fullfillCommitSha="$GITHUB_SHA" --meta fullfillWorkflowRun="$GITHUB_RUN_ID"
      - name: Deploy kitchen site
        if: steps.target.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_KITCHEN_TOKEN }}
          VERCEL_PROJECT_ID: prj_rRfVZgfsxaEJ9cw30hTrHN41zc6N
        run: >-
          vercel deploy --prod --yes --no-color
          --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"
          --meta fullfillCommitSha="$GITHUB_SHA" --meta fullfillWorkflowRun="$GITHUB_RUN_ID"
      - name: Check live endpoints
        if: steps.target.outputs.current == 'true'
        run: |
          for url in https://fullfill-api.vercel.app/v1/session https://fullfill-order.vercel.app https://fullfill-kitchen.vercel.app; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 --output /dev/null "$url"
          done
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Deployed commit $GITHUB_SHA after checks passed:
          - [Ordering site](https://fullfill-order.vercel.app)
          - [Kitchen site](https://fullfill-kitchen.vercel.app)
          - [API](https://fullfill-api.vercel.app)
          EOF
